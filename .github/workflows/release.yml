name: Release

# Runs on every push to main (publishing/updating the rolling "latest"
# release that internal/update tracks for self-updating) and on version
# tags (publishing a proper, permanent release under that tag).
on:
  push:
    branches: [main]
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      matrix:
        include:
          - goos: darwin
            goarch: arm64
            asset: Darwin_arm64
          - goos: darwin
            goarch: amd64
            asset: Darwin_x86_64
          - goos: linux
            goarch: arm64
            asset: Linux_arm64
          - goos: linux
            goarch: amd64
            asset: Linux_x86_64
          - goos: windows
            goarch: amd64
            asset: Windows_x86_64
          - goos: windows
            goarch: arm64
            asset: Windows_arm64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          set -eu
          mkdir -p dist
          binary=setfree
          if [ "${{ matrix.goos }}" = "windows" ]; then binary=setfree.exe; fi
          version="${{ github.ref_name }}"
          if [ "${{ github.ref_type }}" != "tag" ]; then version="main"; fi
          go build -trimpath \
            -ldflags "-s -w -X github.com/mindsdb/setfree/internal/version.Version=$version -X github.com/mindsdb/setfree/internal/version.Commit=${{ github.sha }}" \
            -o "dist/$binary" ./cmd/setfree

      - name: Package
        run: |
          set -eu
          cd dist
          if [ "${{ matrix.goos }}" = "windows" ]; then
            zip "setfree_${{ matrix.asset }}.zip" setfree.exe
            rm setfree.exe
          else
            tar -czf "setfree_${{ matrix.asset }}.tar.gz" setfree
            rm setfree
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: setfree_${{ matrix.asset }}
          path: dist/*
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums and commit marker
        run: |
          set -eu
          cd dist
          sha256sum * > checksums.txt
          echo "${{ github.sha }}" > commit.txt

      # Tag pushes (v1.2.3) publish a permanent release under that tag.
      # Everything else (every push to main) republishes the single
      # rolling "latest" release that internal/update polls for
      # self-updating — same tag name, contents replaced each time.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}
          name: ${{ github.ref_type == 'tag' && github.ref_name || 'Latest (main)' }}
          body: ${{ github.ref_type == 'tag' && '' || format('Continuous build from main at {0}.', github.sha) }}
          generate_release_notes: ${{ github.ref_type == 'tag' }}
          files: dist/*
